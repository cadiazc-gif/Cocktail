<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carta del Bar</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260724d" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <div class="hero-top">
          <div>
            <div class="hero-badge">Carta digital del bar</div>
            <h1>Cocteles seleccionados para la noche</h1>
            <p>
              Una experiencia de carta elegante y funcional, pensada para descubrir
              cada bebida con su perfil, ingredientes y preparación en pocos segundos.
            </p>
          </div>
          <div class="hero-actions">
            <div class="hero-stat">
            <strong id="heroCount">0</strong>
            <span>Cocktails disponibles en la carta</span>
          </div>
            <a class="button secondary" href="/a">Administrador</a>
          </div>
        </div>
      </section>

      <section class="filters is-collapsed">
        <div class="filters-bar">
          <button id="filtersToggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filtersPanel">
            <span>Filtros</span>
            <span class="filters-toggle-icon" aria-hidden="true">+</span>
          </button>
          <input id="globalSearch" class="filters-search" type="search" placeholder="Buscar cóctel, ingrediente, tag, vaso..." aria-label="Buscar en la carta" />
          <button id="favoriteFilter" class="chip star-filter" type="button" aria-pressed="false" title="Solo favoritos">&#9734;</button>
          <button id="rouletteButton" class="chip roulette-filter" type="button" title="Sortear un cóctel al azar">
            <svg class="roulette-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle cx="12" cy="12" r="9.5" fill="none" stroke="#1a1a1a" stroke-width="1.5" />
              <path d="M12 12 L12 2.5 A9.5 9.5 0 0 1 20.23 7.25 Z" fill="#c0392b" />
              <path d="M12 12 L20.23 7.25 A9.5 9.5 0 0 1 20.23 16.75 Z" fill="#1a1a1a" />
              <path d="M12 12 L20.23 16.75 A9.5 9.5 0 0 1 12 21.5 Z" fill="#c0392b" />
              <path d="M12 12 L12 21.5 A9.5 9.5 0 0 1 3.77 16.75 Z" fill="#1a1a1a" />
              <path d="M12 12 L3.77 16.75 A9.5 9.5 0 0 1 3.77 7.25 Z" fill="#c0392b" />
              <path d="M12 12 L3.77 7.25 A9.5 9.5 0 0 1 12 2.5 Z" fill="#1a1a1a" />
              <circle cx="12" cy="12" r="1.8" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="0.6" />
            </svg>
          </button>
        </div>
        <div id="filtersPanel" class="filters-grid hidden">
          <label>
            Buscar por ingrediente
            <input id="ingredientFilter" placeholder="tequila, menta, gin..." />
          </label>
          <label>
            Tag
            <div class="filter-picker" data-picker="public-tag">
              <button id="tagFilterButton" class="picker-button" type="button">Todos los tags</button>
              <div id="tagFilterPanel" class="picker-panel hidden">
                <input id="tagSearchInput" class="picker-search" placeholder="Buscar tag..." />
                <div id="tagFilterOptions" class="picker-options"></div>
              </div>
            </div>
          </label>
          <label>
            Alcohol
            <select id="alcoholFilter">
              <option value="all">Todos</option>
              <option value="Fuerte">Fuerte</option>
              <option value="Medio">Medio</option>
              <option value="Suave">Suave</option>
              <option value="Sin alcohol">Sin alcohol</option>
            </select>
          </label>
          <label>
            Vaso
            <div class="filter-picker" data-picker="public-glass">
              <button id="glassFilterButton" class="picker-button" type="button">Todos los vasos</button>
              <div id="glassFilterPanel" class="picker-panel hidden">
                <input id="glassSearchInput" class="picker-search" placeholder="Buscar vaso..." />
                <div id="glassFilterOptions" class="picker-options"></div>
              </div>
            </div>
          </label>
          <label>
            Lista especial
            <select id="listFilter">
              <option value="">Todas las listas</option>
            </select>
          </label>
          <label>
            Rating
            <select id="ratingFilter">
              <option value="all">Todas</option>
              <option value="0">Sin probar (0)</option>
              <option value="3">3 o más</option>
              <option value="4">4 o más</option>
              <option value="4.5">4.5 o más</option>
            </select>
          </label>
          <label>
            Ordenar
            <select id="sortFilter">
              <option value="rating-desc">Mejor Rating</option>
              <option value="alpha-asc">Abecedario A-Z</option>
            </select>
          </label>
        </div>
      </section>

      <section id="cocktailGrid" class="menu-list"></section>
      <p class="footer-note">QR fijo sugerido: apunta siempre a `/m`.</p>
    </main>
    <script src="/static/menu.js?v=20260724d"></script>
  </body>
</html>
